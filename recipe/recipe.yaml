context:
  version: "2.20.0"

package:
  name: mdcat
  version: ${{ version }}

source:
  url: https://github.com/BIRSAx2/mdcat/archive/mdcat-${{ version }}.tar.gz
  sha256: 3436d183cf55d628245b30e605f14a4d7b3b129a457e34eac029828e2c2a07e6

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - openssl

tests:
  - script:
      - mdcat --help

about:
  license: MPL-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Show markdown documents on text terminals
  homepage: https://github.com/BIRSAx2/mdcat
  repository: https://github.com/BIRSAx2/mdcat

extra:
  recipe-maintainers:
    - danielnachun
