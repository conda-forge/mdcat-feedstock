context:
  version: "2.16.1"

package:
  name: mdcat
  version: ${{ version }}

source:
  url: https://github.com/BIRSAx2/mdcat/archive/mdcat-${{ version }}.tar.gz
  sha256: 8b47467dc5f9367409ba07ad20e89eb1ac09700748394b917cc3d4184a156748

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - openssl

tests:
  - script:
      - mdcat --help

about:
  license: MPL-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Show markdown documents on text terminals
  homepage: https://github.com/BIRSAx2/mdcat
  repository: https://github.com/BIRSAx2/mdcat

extra:
  recipe-maintainers:
    - danielnachun
